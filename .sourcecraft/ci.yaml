# CI Proba: go vet, golangci-lint (включая depguard), go test.
# Формат: https://sourcecraft.dev/portal/docs/en/sourcecraft/operations/ci-cd
on:
  pull_request:
    - workflows: [checks]
      filter:
        target_branches: ["main"]
  push:
    - workflows: [checks]
      filter:
        branches: ["main"]

workflows:
  checks:
    tasks:
      - name: go-checks
        cubes:
          - name: vet
            image: docker.io/library/golang:1.24
            script:
              - go vet ./...

          - name: lint
            image: docker.io/library/golang:1.24
            script:
              - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
              - $(go env GOPATH)/bin/golangci-lint run ./...
              - $(go env GOPATH)/bin/golangci-lint fmt --diff

          - name: test
            image: docker.io/library/golang:1.24
            script:
              - go test -race -count=1 ./...
