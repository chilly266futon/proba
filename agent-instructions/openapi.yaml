      required:
      - id
      - email
      - role
    Campaign:
      type: object
      properties:
        id: *id003
        name: *id001
        type:
          type: string
          enum:
          - nearby_push
        status:
          type: string
          enum:
          - draft
          - active
          - paused
          - finished
        audience:
          type: object
          properties:
            beverage_id:
              type: string
              format: uuid
              nullable: true
            min_match_percent:
              type: integer
              minimum: 0
              maximum: 100
              nullable: true
        radius_m: *id002
        schedule:
          type: object
          properties:
            days:
              type: array
              items:
                type: string
                enum:
                - mon
                - tue
                - wed
                - thu
                - fri
                - sat
                - sun
            from: *id001
            to: *id001
        per_guest_weekly_limit: *id002
        budget_per_visit_kop:
          type: integer
          minimum: 0
          description: Деньги в копейках.
          nullable: true
        title: *id001
        body: *id001
        stats:
          type: object
          properties:
            impressions: *id002
            visits: *id002
            conversion_percent: *id005
          nullable: true
      required:
      - id
      - name
      - type
      - status
    FlagState:
      type: object
      properties:
        key: *id001
        title: *id001
        group: *id001
        enabled: *id009
        rollout_percent: *id027
        platforms:
          type: array
          items:
            type: string
            enum:
            - ios
            - android
        groups:
          type: array
          items: *id001
        depends_on:
          type: array
          items: *id001
      required:
      - key
      - enabled
      - rollout_percent
      - depends_on
    AuditEvent:
      type: object
      properties:
        id: *id003
        at: *id015
        actor: *id001
        actor_role: *id001
        action: *id001
        target:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
      required:
      - id
      - at
      - actor
      - action
    ModerationReport:
      type: object
      properties:
        id: *id003
        kind:
          type: string
          enum:
          - complaint
          - disputed_review
          - spam
        target_type:
          type: string
          enum:
          - tasting
          - comment
          - venue
        target_id: *id003
        reason: *id001
        text:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - open
          - resolved
        created_at: *id015
      required:
      - id
      - kind
      - target_type
      - target_id
      - status
