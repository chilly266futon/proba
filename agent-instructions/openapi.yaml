components:
  securitySchemes:
    appAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: aud=app. Проверяется локально, без обращения в БД.
    cabinetAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: aud=cabinet; в токене роль и venue_id.
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: aud=admin; 2FA обязателен.
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: *id001
      description: Непрозрачный курсор из next_cursor
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: *id003
      description: UUID, генерируется клиентом. Повтор с тем же ключом возвращает исходный результат (офлайн-очередь,
        ретраи).
    ProfileId:
      name: X-Profile-Id
      in: header
      required: false
      schema: *id003
      description: Активный профиль внутри аккаунта (личный/гостевой). По умолчанию — личный.
    VenueId:
      name: venueId
      in: path
      required: true
      schema: *id003
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Нет или просрочен токен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Нет прав или фича выключена (code=feature_disabled)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Конфликт (в т.ч. повторный Idempotency-Key с другим телом)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Ошибка валидации (details — по полям)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Слишком часто
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          description: 'Машинный код: validation_failed, feature_disabled, not_found, conflict, rate_limited, ...'
        message: *id001
        details:
          type: object
          additionalProperties: true
        request_id: *id001
      required:
      - code
      - message
    Category: *id004
    Geo:
