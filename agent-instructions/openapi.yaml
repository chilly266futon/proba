openapi: 3.0.3
info:
  title: Proba API
  version: 0.1.0-draft
  description: 'Контракт backend платформы Proba (дегустации кофе, пива, вина). Спецификация написана по дизайн-макету
    «Proba — дизайн приложения» (41 экран: приложение, кабинет заведения К1–К8, админка А1–А9) и зафиксированному
    стеку (Go, YDB, Yandex Serverless Containers).


    **Как читать.** Каждая операция помечена: `x-phase` (1 — MVP-ядро, 2 — открытия и B2B-хук, 3 — заведения и контент,
    4 — AI, оборудование, подписка), `x-flag` (фича-флаг из реестра; выключен → 403 feature_disabled), `x-module`
    (модуль монолита-владелец), `x-screen` (экран макета). Контракт описывает весь макет; реализуется по фазам.
    Всё, чего нет на backend, клиент скрывает флагом.


    **Конвенции.** Деньги — целые копейки. Оценка — целые десятые (`rating_tenths`, 85 = 8,5). Идентификаторы —
    UUID. Время — RFC 3339 UTC. Списки — курсорная пагинация (`limit`, `cursor` → `next_cursor`). Создание проб
    — с заголовком `Idempotency-Key`. Ошибки — объект `Error`. Три независимых аудитории токенов: `appAuth` (приложение),
    `cabinetAuth` (сотрудники заведений), `adminAuth` (сотрудники платформы).'
servers:
- url: https://api.example.invalid/v1
  description: Домен API Gateway — заменить
tags:
- name: Config
- name: Auth
- name: Me
- name: Catalog
- name: Tastings
- name: Social
- name: Passport
- name: Venues
- name: Recommendations
- name: Shelf
- name: Learn
- name: Brew
- name: Equipment
- name: AI
- name: Share
- name: Billing
- name: Cabinet
- name: Admin
paths:
  /config/flags:
    get:
      tags:
      - Config
      summary: Флаги для текущего пользователя
      operationId: getConfigFlags
      description: 'Уже разрешённые значения (раскатка по %, платформе, группе и зависимости учтены на сервере).
        Клиент прячет всё, что выключено, и не резервирует место. Токен необязателен: без него — значения для анонима.
        Кэш: ETag + max-age.'
      parameters:
      - name: If-None-Match
        in: header
        schema: &id001
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  flags:
                    type: object
                    additionalProperties: &id009
                      type: boolean
                  ttl_seconds: &id002
                    type: integer
                required:
                - flags
      security: []
      x-phase: 1
      x-module: platform
      x-screen: 22 Настройки · 23 Состояния флагов
  /uploads/presign:
    get:
      tags:
      - Config
      summary: Получить URL для загрузки файла
      operationId: getUploadsPresign
      description: Клиент делает PUT в Object Storage по url, затем передаёт upload_id в нужный метод. Тип и размер
        ограничены по purpose.
      parameters:
      - name: purpose
        in: query
        required: true
        schema:
          type: string
          enum:
          - tasting_photo
          - receipt
          - avatar
          - venue_photo
          - verification_doc
          - beverage_photo
      - name: content_type
        in: query
        required: true
        schema: *id001
      - name: size_bytes
        in: query
        required: true
        schema: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - appAuth: []
      x-phase: 1
      x-module: platform
  /auth/yandex:
    post:
      tags:
      - Auth
      summary: Вход через Яндекс ID
      operationId: postAuthYandex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oauth_token: *id001
                device:
                  $ref: '#/components/schemas/DeviceInfo'
                consents:
                  $ref: '#/components/schemas/Consents'
              required:
              - oauth_token
              - device
              - consents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
      x-flag: auth.yandex_id
      x-phase: 1
      x-module: users
      x-screen: 01 Вход
  /auth/phone/request:
    post:
      tags:
      - Auth
      summary: Запросить код по SMS
      operationId: postAuthPhoneRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: E.164
                device:
                  $ref: '#/components/schemas/DeviceInfo'
              required:
              - phone
      responses:
        '204':
          description: Нет содержимого
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-flag: auth.phone
      x-phase: 1
      x-module: users
      x-screen: 01 Вход
  /auth/phone/verify:
    post:
      tags:
      - Auth
      summary: Подтвердить код
      operationId: postAuthPhoneVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: *id001
                code: *id001
                device:
                  $ref: '#/components/schemas/DeviceInfo'
                consents:
                  $ref: '#/components/schemas/Consents'
              required:
              - phone
              - code
              - device
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-flag: auth.phone
      x-phase: 1
      x-module: users
      x-screen: 01 Вход
  /auth/guest:
    post:
      tags:
      - Auth
      summary: Продолжить без аккаунта
      operationId: postAuthGuest
      description: Создаёт анонимный аккаунт. Данные сохраняются и позже привязываются к методу входа через /auth/link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device:
                  $ref: '#/components/schemas/DeviceInfo'
                consents:
                  $ref: '#/components/schemas/Consents'
              required:
              - device
              - consents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
      x-flag: auth.guest
      x-phase: 1
      x-module: users
      x-screen: 01 Вход
  /auth/link:
    post:
      tags:
      - Auth
      summary: Привязать метод входа к гостевому аккаунту
      operationId: postAuthLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum:
                  - yandex_id
                  - vk_id
                  - phone
                  - telegram
                oauth_token:
                  type: string
                  nullable: true
                phone:
                  type: string
                  nullable: true
                code:
                  type: string
                  nullable: true
              required:
              - method
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - appAuth: []
      x-flag: auth.guest
      x-phase: 1
      x-module: users
      x-screen: 22 Настройки
  /auth/vk:
    post:
      tags:
      - Auth
      summary: Вход через VK ID
      operationId: postAuthVk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oauth_token: *id001
                device:
                  $ref: '#/components/schemas/DeviceInfo'
                consents:
                  $ref: '#/components/schemas/Consents'
              required:
              - oauth_token
              - device
              - consents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
      x-flag: auth.vk_id
      x-phase: 1
      x-module: users
      x-screen: 01 Вход
  /auth/telegram/verify:
    post:
      tags:
      - Auth
      summary: Вход по коду из Telegram-бота
      operationId: postAuthTelegramVerify
      description: 'Пользователь открывает бота @proba_bot и жмёт /start — бот присылает одноразовый
        код, привязанный к его telegram_id. Код вводится в приложении. Новый код — повторный /start.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: *id001
                device:
                  $ref: '#/components/schemas/DeviceInfo'
                consents:
                  $ref: '#/components/schemas/Consents'
              required:
              - code
              - device
              - consents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
      x-flag: auth.telegram
      x-phase: 1
      x-module: users
      x-screen: 01 Вход
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Обновить токены
      operationId: postAuthRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: *id001
              required:
              - refresh_token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
      x-phase: 1
      x-module: users
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Выйти (отозвать refresh-токен)
      operationId: postAuthLogout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: *id001
              required:
              - refresh_token
      responses:
        '204':
          description: Нет содержимого
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - appAuth: []
      x-phase: 1
      x-module: users
  /me:
    get:
      tags:
      - Me
      summary: Текущий аккаунт
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - appAuth: []
      x-phase: 1
      x-module: users
    patch:
      tags:
      - Me
      summary: Изменить имя или аватар
      operationId: patchMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: *id001
                avatar_upload_id:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - appAuth: []
      x-phase: 1
      x-module: users
      x-screen: 07 Паспорт
  /me/deletion-requests:
    post:
      tags:
      - Me
      summary: Запросить удаление данных
      operationId: postMeDeletionRequests
      description: Исполняется в течение 30 дней. Пробы остаются обезличенными для статистики каталога (см. админку).
      responses:
        '204':
          description: Нет содержимого
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - appAuth: []
      x-phase: 1
      x-module: users
      x-screen: А2 Пользователи
  /me/profiles:
    get:
      tags:
      - Me
      summary: Мои профили
      operationId: getMeProfiles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
                required:
                - items
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - appAuth: []
      x-phase: 1
      x-module: users
      x-screen: 22 Настройки
    post:
      tags:
      - Me
      summary: Добавить профиль (для гостей)
      operationId: postMeProfiles
      description: Несколько профилей — функция Proba+. Модель данных (account → profile) закладываем сразу, эндпоинт
        включаем в фазе 4.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: *id001
              required:
              - name
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - appAuth: []
      x-flag: premium.subscription
      x-phase: 4
      x-module: users
      x-screen: 22 Настройки
  /me/profiles/{profileId}:
    patch:
      tags:
      - Me
      summary: Переименовать профиль
      operationId: patchMeProfilesByProfileId
      parameters:
      - name: profileId
        in: path
        required: true
        schema: &id003
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - appAuth: []
      x-flag: premium.subscription
      x-phase: 4
      x-module: users
    delete:
      tags:
      - Me
      summary: Удалить профиль
      operationId: deleteMeProfilesByProfileId
      parameters:
      - name: profileId
        in: path
        required: true
        schema: *id003
      responses:
        '204':
          description: Нет содержимого
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - appAuth: []
      x-flag: premium.subscription
      x-phase: 4
      x-module: users
  /me/settings:
    get:
      tags:
      - Me
      summary: Настройки
      operationId: getMeSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - appAuth: []
      x-phase: 1
      x-module: users
      x-screen: 22 Настройки
    put:
      tags:
      - Me
      summary: Сохранить настройки
      operationId: putMeSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - appAuth: []
      x-phase: 1
      x-module: users
      x-screen: 22 Настройки
  /me/push-tokens:
    post:
      tags:
      - Me
      summary: Зарегистрировать push-токен устройства
      operationId: postMePushTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum:
                  - apns
                  - fcm
                  - rustore
                token: *id001
                device:
                  $ref: '#/components/schemas/DeviceInfo'
              required:
              - provider
              - token
      responses:
        '204':
          description: Нет содержимого
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - appAuth: []
      x-phase: 1
      x-module: users
  /me/push-tokens/{token}:
    delete:
      tags:
      - Me
      summary: Удалить push-токен
      operationId: deleteMePushTokensByToken
      parameters:
      - name: token
        in: path
        required: true
        schema: *id001
      responses:
        '204':
          description: Нет содержимого
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - appAuth: []
      x-phase: 1
      x-module: users
  /me/taste-profile:
    get:
      tags:
      - Me
      summary: Вкусовой профиль
      operationId: getMeTasteProfile
      parameters:
      - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasteProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - appAuth: []
      x-flag: onboarding.taste_profile
      x-phase: 1
      x-module: tastings
      x-screen: 06 Проба · радар · 07 Паспорт
  /me/taste-profile/seed:
    put:
      tags:
      - Me
      summary: Стартовый выбор стилей (онбординг)
      operationId: putMeTasteProfileSeed
      description: Профиль уточняется с каждой пробой; пересчёт — событием tasting.published (асинхронно, не в запросе).
      parameters:
      - $ref: '#/components/parameters/ProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TasteSeed'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasteProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - appAuth: []
      x-flag: onboarding.taste_profile
      x-phase: 1
      x-module: tastings
      x-screen: 02 Онбординг
  /catalog/onboarding-options:
    get:
      tags:
      - Catalog
      summary: Стили для стартового выбора
      operationId: getCatalogOnboardingOptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - appAuth: []
      x-flag: onboarding.taste_profile
      x-phase: 1
      x-module: catalog
      x-screen: 02 Онбординг
  /catalog/taste-models/{category}:
    get:
      tags:
      - Catalog
      summary: 'Модель вкуса категории: оси и колесо'
      operationId: getCatalogTasteModelsByCategory
      description: Справочник управляется из админки (А4). Клиент кэширует по version.
      parameters:
      - name: category
        in: path
        required: true
        schema: &id004
          type: string
          enum: &id010
          - coffee
          - beer
          - wine
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasteModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - appAuth: []
      x-phase: 1
      x-module: catalog
      x-screen: 04 Новая проба · 05 Колесо вкусов · 06 Радар
  /catalog/beverages:
    get:
      tags:
      - Catalog
      summary: Поиск по каталогу
      operationId: getCatalogBeverages
